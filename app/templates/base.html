<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#00BFFF">
<title>{% block title %}Boost Reseller{% endblock %}</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --primary:#00BFFF;
  --primary-d:#0096C7;
  --primary-l:#E0F7FF;
  --accent:#FF6600;
  --accent-d:#E65C00;
  --dark:#0F172A;
  --mid:#475569;
  --light:#94A3B8;
  --off:#F8FAFC;
  --white:#ffffff;
  --gray:#E2E8F0;
  --green:#059669;
  --red:#DC2626;
  --violet:#7C3AED;
}

html{scroll-behavior:smooth}

body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--off);
  color:var(--mid);
  min-height:100vh;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

a{color:inherit;text-decoration:none}
img{max-width:100%;height:auto;display:block}
button{font-family:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;outline:none}

/* Boutons generiques */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 24px;border-radius:12px;font-weight:700;font-size:.95rem;border:none;cursor:pointer;transition:all .25s;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;box-shadow:0 6px 18px rgba(0,191,255,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,191,255,.4)}
.btn-accent{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;box-shadow:0 6px 18px rgba(255,102,0,.3)}
.btn-accent:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(255,102,0,.4)}
.btn-outline{background:transparent;border:2px solid var(--primary);color:var(--primary)}
.btn-outline:hover{background:var(--primary);color:#fff}

/* Header public */
.pub-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--white);border-bottom:1px solid var(--gray);position:sticky;top:0;z-index:100}
.pub-logo{font-size:1.15rem;font-weight:900;background:linear-gradient(90deg,var(--primary),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.pub-nav{display:flex;gap:10px;align-items:center}

/* Sections */
.section{padding:60px 20px}
.container{max-width:1100px;margin:0 auto}

/* Titres */
h1,h2,h3,h4{color:var(--dark);line-height:1.25}

{% block extra_css %}{% endblock %}
</style>
</head>
<body>

{% block nav %}{% endblock %}

{% block content %}{% endblock %}

{% block extra_js %}{% endblock %}

</body>
</html>
